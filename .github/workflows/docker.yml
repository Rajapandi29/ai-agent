name: Build Push Deploy ECS

on:
  workflow_run:
    workflows:
      - Terraform Apply
    types:
      - completed

env:
  AWS_REGION: us-east-1

  FRONTEND_ECR_REPOSITORY: ai-agent-frontend
  BACKEND_ECR_REPOSITORY: ai-agent-backend

  ECS_CLUSTER: ai-agent-cluster
  FRONTEND_ECS_SERVICE: ai-agent-frontend
  BACKEND_ECS_SERVICE: ai-agent-backend

jobs:
  deploy:
    name: Build Push Deploy
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Frontend
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:latest \
            ./frontend

      - name: Build Backend
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:latest \
            ./backend

      - name: Push Frontend
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:latest

      - name: Push Backend
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:latest

      - name: Deploy Frontend ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $FRONTEND_ECS_SERVICE \
            --force-new-deployment

      - name: Deploy Backend ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $BACKEND_ECS_SERVICE \
            --force-new-deployment