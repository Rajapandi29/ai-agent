
name: Build and Deploy Next.js to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install frontend dependencies
        working-directory: sample/frontend
        run: npm install

      - name: Build frontend
        working-directory: sample/frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: sample/backend
        run: npm install

      - name: Prepare deployment
        run: |
          mkdir -p sample/backend/frontend
          cp -a sample/frontend/.next sample/backend/frontend/
          cp sample/frontend/package.json sample/backend/frontend/
          if [ -d sample/frontend/public ]; then
            cp -a sample/frontend/public sample/backend/frontend/public
          fi
          test -f sample/backend/server.js
          test -f sample/backend/package.json
          test -f sample/backend/frontend/.next/BUILD_ID

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: sample/backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7E100DFDCC1E4B619BE26BD880710D14 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3C5E1EF2E7924ACB89F50405198BCCA8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_96D16614EF04479CA51EE98A7483D0FF }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: sample-apps
          slot-name: Production
          package: deploy
