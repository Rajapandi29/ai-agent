
name: Build and deploy Node.js to Azure Function App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "."
  NODE_VERSION: "22.x"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify project files
        run: |
          test -f package.json || {
            echo "ERROR: package.json is missing"
            exit 1
          }
          test -f host.json || {
            echo "ERROR: host.json is missing; this is not an Azure Functions project root"
            exit 1
          }

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build --if-present

      - name: Run tests
        run: npm run test --if-present

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: |
            .
            !node_modules/**
            !.git/**
            !.github/**
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: function-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7D13BB9D047F4FAA801D1CC8E8A37757 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A018C8F5A6494C4E9594862685464273 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E6BB268F9C4C4B288792BF67E045B6D8 }}

      - name: Deploy Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: my-function
          package: deploy
